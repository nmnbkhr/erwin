name: Deploy BAIW

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Check bundle sizes
        run: |
          echo "Bundle sizes:"
          du -sh dist/
          ls -la dist/assets/*.js | awk '{print $5, $9}' | sort -rn | head -10

      # Vercel deployment (uncomment and add VERCEL_TOKEN secret)
